name: Codefx installer safety
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/install/**, .github/workflows/codefx-install.yml]
  pull_request:
    paths: [scripts/install/**, .github/workflows/codefx-install.yml]
permissions:
  contents: read
jobs:
  installers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { persist-credentials: false }
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with: { python-version: "3.12" }
      - name: Shell transaction checks
        shell: bash
        run: |
          sh -n scripts/install/install.sh scripts/install/install-codefx.sh
          python3 -m unittest discover -s scripts/install -p test_install_transactions.py -v
      - name: Existing Linux regression suite
        run: python3 -m unittest discover -s scripts/install -p test_install_sh.py -v
