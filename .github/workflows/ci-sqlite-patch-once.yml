# Temporary one-shot security remediation; remove after successful verification.
name: Codefx one-shot patched SQLite binding
on:
  push:
    branches:
      - ci/linux-only-cache-20261110
    paths:
      - .github/workflows/ci-sqlite-patch-once.yml

permissions:
  contents: write

concurrency:
  group: codefx-sqlite-remediation
  cancel-in-progress: false

jobs:
  remediation:
    if: github.repository == 'hitmux/codefx' && github.ref == 'refs/heads/ci/linux-only-cache-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci/linux-only-cache-20261110
          persist-credentials: true
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: '1.95.0'
      - name: Vendor authentic SQLx SQLite 0.9.0 source and minimally widen the security fix range
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/sqlx-sqlite
          curl --fail --location --retry 7 --retry-delay 3 \
            'https://static.crates.io/crates/sqlx-sqlite/sqlx-sqlite-0.9.0.crate' \
            -o "${RUNNER_TEMP}/sqlx-sqlite-0.9.0.crate"
          printf '%s  %s\n' \
            '488e99c397a62007e4229aec669a179816339afc6d2620ca6fa420dbee2e982c' \
            "${RUNNER_TEMP}/sqlx-sqlite-0.9.0.crate" | sha256sum --check --status
          tar -xzf "${RUNNER_TEMP}/sqlx-sqlite-0.9.0.crate" --strip-components 1 \
            -C vendor/sqlx-sqlite
          python3 - <<'PY'
          from pathlib import Path
          p = Path('vendor/sqlx-sqlite/Cargo.toml')
          original = p.read_text()
          assert original.count('>=0.30.1, <0.38.0') == 1
          p.write_text(original.replace('>=0.30.1, <0.38.0', '>=0.30.1, <0.40.0'))
          root = Path('codex-rs/Cargo.toml')
          original = root.read_text()
          old = 'libsqlite3-sys = { version = "0.37", default-features = false }'
          assert original.count(old) == 1
          original = original.replace(
              old, 'libsqlite3-sys = { version = "=0.39.1", default-features = false }'
          )
          marker = '[patch.crates-io]\n'
          assert original.count(marker) == 1
          assert 'sqlx-sqlite = { path = "../vendor/sqlx-sqlite" }' not in original
          original = original.replace(
              marker,
              marker + '# Codefx security backport: widen SQLite range until SQLx publishes the upstream fix.\n'
              + 'sqlx-sqlite = { path = "../vendor/sqlx-sqlite" }\n'
          )
          root.write_text(original)
          PY
      - name: Refresh Cargo lock against patched SQLx and SQLite 3.54.1
        shell: bash
        run: |
          set -euo pipefail
          cargo update --manifest-path codex-rs/Cargo.toml \
            -p libsqlite3-sys --precise 0.39.1
          cargo metadata --manifest-path codex-rs/Cargo.toml \
            --format-version 1 --locked --no-deps > /dev/null
          cargo tree --manifest-path codex-rs/Cargo.toml -i libsqlite3-sys --locked \
            | head -n 80 || true
      - name: Prepare Linux Bazel toolchain
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: bazel-lockfile
          action-cache: 'false'
      - name: Update Bazel module extension lock
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/run_bazel_with_buildbuddy.py mod deps --lockfile_mode=update
          test -s MODULE.bazel.lock
      - name: Verify security dependency versions then commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          packages = {x['name']: x for x in tomllib.loads(
              Path('codex-rs/Cargo.lock').read_text()
          )['package']}
          assert packages['libsqlite3-sys']['version'] == '0.39.1'
          assert packages['openssl']['version'] == '0.10.78'
          assert packages['sqlx-sqlite']['version'] == '0.9.0'
          assert 'source' not in packages['sqlx-sqlite']
          print('SQLx and SQLite package resolution verified')
          PY
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- vendor/sqlx-sqlite codex-rs/Cargo.toml codex-rs/Cargo.lock MODULE.bazel.lock
          git commit -m 'security: backport SQLx SQLite dependency range and bundle SQLite 3.54.1'
          git push origin HEAD:refs/heads/ci/linux-only-cache-20261110
