name: Codefx CI formatting suggestions
on:
  pull_request:
    paths:
      - .github/**
      - codex-rs/**/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/v8-poc/**
      - vendor/**/Cargo.toml
      - scripts/install/*.py
      - sdk/typescript/**
  workflow_dispatch:
    inputs:
      http_regressions:
        description: Run focused HTTP transport regressions on the selected source
        type: boolean
        default: false
      plugin_regressions:
        description: Verify plugin isolation and local plugin compatibility
        type: boolean
        default: false
      runtime_regressions:
        description: Diagnose CLI startup and shell snapshot regressions
        type: boolean
        default: false
      runtime_component:
        description: Runtime component to verify
        type: choice
        options: [all, exec, shell, app-server, core, v8, budget, clippy]
        default: all
      sdk_regressions:
        description: Verify SDK child process lifecycle regressions
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  runtime-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.runtime_component == 'shell' && '["shell"]' || inputs.runtime_component == 'exec' && '["exec"]' || inputs.runtime_component == 'app-server' && '["app-server"]' || inputs.runtime_component == 'core' && '["core"]' || inputs.runtime_component == 'v8' && '["v8"]' || inputs.runtime_component == 'budget' && '["budget"]' || inputs.runtime_component == 'clippy' && '["clippy"]' || '["exec","shell"]') }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_CI_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      RUST_LOG: codex_exec_server=warn
      RUST_MIN_STACK: "8388608"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: ./.github/actions/codefx-linux-voice-sdk
        if: matrix.component != 'shell' && matrix.component != 'v8'
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy
      - uses: ./.github/actions/setup-rusty-v8
        if: matrix.component != 'shell'
        with:
          target: x86_64-unknown-linux-gnu
      - name: Install sandbox test prerequisites
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends build-essential libcap-dev bubblewrap
      - name: Reuse Cargo download inputs
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-sources-v2-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-nextest@0.9.103
      - name: Prepare bundled sandbox executable
        if: matrix.component != 'v8'
        working-directory: codex-rs
        run: |
          cargo build --locked --profile ci-test --bin bwrap
          runtime="$CARGO_TARGET_DIR/ci-test"
          echo "CODEX_BWRAP_SHA256=$(sha256sum "$runtime/bwrap" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          install -Dm755 "$runtime/bwrap" "$runtime/codex-resources/bwrap"
      - name: Verify shell snapshot regressions
        if: matrix.component == 'shell'
        working-directory: codex-rs
        run: cargo nextest run --locked --cargo-profile ci-test -p codex-exec-server --no-fail-fast --test-threads 2 --retries 0 -E 'test(shell_snapshot)'
      - name: Verify isolated CLI startup
        if: matrix.component == 'exec'
        working-directory: codex-rs
        run: |
          cargo build --locked --profile ci-test --bin codex-exec --bin codex-linux-sandbox --bin codex-code-mode-host
          export CARGO_BIN_EXE_codex_linux_sandbox="$CARGO_TARGET_DIR/ci-test/codex-linux-sandbox"
          cargo nextest run --locked --cargo-profile ci-test -p codex-exec --no-fail-fast --test-threads 2 --retries 0
      - name: Verify account and plugin protocol regressions
        if: matrix.component == 'app-server'
        working-directory: codex-rs
        run: |
          cargo build --locked --profile ci-test --bin codex-app-server --bin codex-linux-sandbox --bin codex-code-mode-host --bin test_stdio_server
          export CARGO_BIN_EXE_codex_linux_sandbox="$CARGO_TARGET_DIR/ci-test/codex-linux-sandbox"
          cargo nextest run --locked --cargo-profile ci-test -p codex-app-server --no-fail-fast --test-threads 2 --retries 0 -E 'test(suite::v2::plugin_) | test(curated_mcp_sync) | test(marketplace_upgrade) | test(plugin_metadata_refresh) | test(marketplace_upgrade_refreshes_hook_runtime) | test(suite::v2::cyber_access_program) | test(recommended_plugins) | test(suite::v2::skills_list) | test(turn_cost_otel)'
      - name: Verify core inference and local plugin regressions
        if: matrix.component == 'core'
        working-directory: codex-rs
        run: |
          cargo build --locked --profile ci-test --bin codex --bin codex-linux-sandbox --bin codex-exec --bin codex-code-mode-host --bin test_stdio_server
          export CARGO_BIN_EXE_codex_linux_sandbox="$CARGO_TARGET_DIR/ci-test/codex-linux-sandbox"
          cargo nextest run --locked --cargo-profile ci-test -p codex-core -p codex-config -p codex-v8-poc --no-fail-fast --test-threads 2 --retries 0 -E 'test(compact_program_tests) | test(rollout_budget) | test(bundled_plugin_compatibility_guard) | test(cli_stream) | test(reads_typed_array_contents) | test(prompt_cache_key) | test(suite::scenarios) | package(codex-config)'
          for iteration in {1..20}; do
            echo "Core scheduling regression iteration $iteration/20"
            cargo nextest run --locked --cargo-profile ci-test -p codex-core --test all --test-threads 2 --retries 0 -E 'test(api_key_subagent_inherits_prompt_cache_key_policy) | test(child_completion_wakes_parent_after_final_answer) | test(matched_response_mocks_capture_only_the_selected_thread)'
          done
      - name: Verify generated binding against the verified native V8 library
        if: matrix.component == 'v8'
        working-directory: codex-rs
        run: cargo nextest run --locked --cargo-profile ci-test -p codex-v8-poc --no-fail-fast --test-threads 2 --retries 0
      - name: Verify shared rollout budget regression
        if: matrix.component == 'budget'
        working-directory: codex-rs
        run: |
          cargo build --locked --profile ci-test --bin codex-linux-sandbox
          export CARGO_BIN_EXE_codex_linux_sandbox="$CARGO_TARGET_DIR/ci-test/codex-linux-sandbox"
          cargo nextest run --locked --cargo-profile ci-test -p codex-core --test all --no-fail-fast --test-threads 2 --retries 0 -E 'test(rollout_budget)'
      - name: Verify full workspace Clippy including test targets
        if: matrix.component == 'clippy'
        working-directory: codex-rs
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
  plugin-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.plugin_regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Reuse Cargo download inputs
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-sources-v2-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: cargo-nextest@0.9.103
      - name: Verify all feature and plugin library regressions
        working-directory: codex-rs
        run: cargo nextest run --locked -p codex-features -p codex-core-plugins -p codex-model-provider-info --lib --no-fail-fast --test-threads 2
  http-regressions:
    if: github.event_name == 'workflow_dispatch' && inputs.http_regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Reuse Cargo download inputs
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-sources-v2-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml') }}
      - name: Check HTTP transport behavior independently of workspace tests
        working-directory: codex-rs
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_DEV_DEBUG: "0"
          RUST_BACKTRACE: "1"
        run: cargo test --locked -p codex-http-client --lib -- --test-threads=1
  cargo-suggestions:
    name: Cargo lockfile and Rust formatting suggestions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: rustfmt
      - name: Produce a minimal lockfile repair and Rust formatting patch
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/codefx-cargo-source.txt"
          # Resolve the existing graph without requesting dependency upgrades.
          # Ordinary validation keeps --locked and rejects any worktree drift.
          cargo metadata --format-version 1 > "$RUNNER_TEMP/codefx-cargo-metadata.json"
          cargo metadata --locked --offline --format-version 1 > /dev/null
          cargo fmt --all -- --config imports_granularity=Item
          git diff --binary -- . > "$RUNNER_TEMP/codefx-cargo-repair.patch"
          git diff --stat
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codefx-cargo-repair
          path: |
            ${{ runner.temp }}/codefx-cargo-repair.patch
            ${{ runner.temp }}/codefx-cargo-source.txt
          if-no-files-found: error
          retention-days: 3
  suggestions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      - name: Prepare formatters from repository locks
        run: pnpm install --frozen-lockfile
      - name: Verify CI policy regression guards
        run: |
          python3 -m unittest discover -s .github/scripts -p test_upstream_ci.py -v
          python3 -m unittest discover -s .github/scripts -p test_codefx_ci.py -v
      - name: Check out the pinned official CI baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: openai/codex
          ref: 6ff1e1ca3b30fc8b914720681fcf5fe62e95f856 # rust-v0.166.0
          path: .tmp/upstream-ci
          persist-credentials: false
      - name: Verify the official Linux graph before expensive builds
        run: python3 .github/scripts/check_upstream_ci.py --upstream .tmp/upstream-ci
      - name: Produce formatting patch in CI
        shell: bash
        run: |
          set -euo pipefail
          dotslash tools/buildifier -mode=fix -lint=off third_party/v8/BUILD.bazel
          uv run --frozen --project scripts ruff format \
            .github/scripts/check_upstream_ci.py \
            .github/scripts/test_upstream_ci.py \
            .github/scripts/verify_cargo_workspace_manifests.py \
            .github/scripts/select_cargo_ci_packages.py \
            .github/scripts/test_codefx_ci.py \
            .github/scripts/verify_bazel_resources.py \
            .github/scripts/bazel_resource_usage.py \
            .github/scripts/check_ci_results.py \
            scripts/install/smoke_source_package.py \
            scripts/install/prepare_sdk_package.py \
            scripts/install/test_prepare_sdk_package.py
          pnpm exec prettier --write .github/workflows/*.yml .github/actions/codefx-linux-runner/action.yml .github/actions/prepare-bazel-ci/action.yml .github/actions/codefx-linux-v8-binding/action.yml .github/actions/setup-rusty-v8/action.yml .github/upstream-ci.json .github/CI_POLICY.md .github/workflows/README.md sdk/typescript/src/exec.ts sdk/typescript/tests/exec.test.ts sdk/typescript/tests/run.test.ts sdk/typescript/tests/testCodex.ts
          git diff --binary > "$RUNNER_TEMP/codefx-ci-format.patch"
          git diff --stat
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codefx-ci-format
          path: ${{ runner.temp }}/codefx-ci-format.patch
          if-no-files-found: error
          retention-days: 3
      - name: Verify SDK child process lifecycle
        if: github.event_name == 'workflow_dispatch' && inputs.sdk_regressions
        run: pnpm -r --filter ./sdk/typescript run test --runInBand tests/exec.test.ts
