name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request:
    paths:
      - "codex-rs/**"
      - "sdk/**"
      - "scripts/**"
      - "tools/**"
      - "third_party/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - "WORKSPACE*"
      - "BUILD*"
      - "*.bzl"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "codex-rs/**"
      - "sdk/**"
      - "scripts/**"
      - "tools/**"
      - "third_party/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - "WORKSPACE*"
      - "BUILD*"
      - "*.bzl"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  # A newer commit supersedes every older PR run. This prevents a burst of
  # commits from consuming a full matrix for each intermediate revision while
  # keeping main pushes serialized for release confidence.
  group: blocking-ci::${{ github.event.pull_request.number || github.ref }}::scheduler-v2
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    name: Bazel
    uses: ./.github/workflows/bazel.yml
    secrets: inherit

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml
    secrets: inherit

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml
    secrets: inherit

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml
    secrets: inherit

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml
    secrets: inherit

  rust-ci:
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  sdk:
    name: sdk
    # SDK Bazel targets overlap with the main GNU Bazel graph. Start this
    # suite after that graph so the shared action cache can be reused while
    # still running the SDK tests when the Bazel suite fails.
    needs: bazel
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/sdk.yml
    secrets: inherit

  required:
    name: CI required
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() && !cancelled() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
