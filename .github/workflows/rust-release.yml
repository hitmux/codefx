name: Disabled upstream Rust publisher (use Codefx verified release)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Block upstream artifact and macOS release path
        run: |
          echo "::error::Upstream Rust release including macOS is disabled in Codefx. Use codefx-rust-v0.166-release.yml."
          exit 1
