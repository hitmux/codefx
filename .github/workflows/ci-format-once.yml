# Temporary single-run formatter, removed after its verified commit.
name: Codefx one-shot workflow formatting
on:
  push:
    branches:
      - ci/linux-only-cache-20261110
    paths:
      - .github/workflows/ci-format-once.yml

permissions:
  contents: write

concurrency:
  group: codefx-one-shot-format
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'hitmux/codefx' && github.ref == 'refs/heads/ci/linux-only-cache-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci/linux-only-cache-20261110
          persist-credentials: true
      - name: Prepare pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          run_install: false
      - name: Prepare Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
      - name: Format only changed YAML workflows
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            .github/workflows/codefx-publish-verified.yml \
            .github/workflows/rust-ci-full.yml \
            .github/workflows/v8-canary.yml
          pnpm exec prettier --check \
            .github/workflows/codefx-publish-verified.yml \
            .github/workflows/rust-ci-full.yml \
            .github/workflows/v8-canary.yml
          # Review the exact formatting patch in job logs. The GitHub Actions
          # token has no workflows permission; the connected maintainer applies
          # this diff with the authorized repository tool.
          git diff -- .github/workflows/codefx-publish-verified.yml \
            .github/workflows/rust-ci-full.yml \
            .github/workflows/v8-canary.yml
