name: Disabled upstream V8 publisher (Codefx Linux/Windows only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Block upstream multi-OS publishing
        run: |
          echo "::error::Upstream V8 release workflow contains macOS release builds and is disabled in Codefx."
          exit 1
